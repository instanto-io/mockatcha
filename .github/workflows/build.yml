name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Verify core and examples in Chrome
      goals: -U clean test
    secrets: inherit

  cross-browser:
    name: Browser tests (${{ matrix.browser_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser_name: Chrome
            runner: browser-chrome
          - browser_name: Firefox
            runner: browser-firefox
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Verify the reactor in ${{ matrix.browser_name }}
      goals: -U test
      maven-args: -Dmockatcha.test.browser=${{ matrix.runner }}
    secrets: inherit

  wasm:
    name: WasmGC
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Verify the reactor compiled to WasmGC
      goals: -U test
      maven-args: -Dteavm.junit.wasm-gc=true -Dteavm.junit.wasm-gc.runner=browser-chrome -Dteavm.junit.js=false
    secrets: inherit

  publish-snapshot:
    if: github.repository == 'instanto-io/mockatcha' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, cross-browser, wasm]
    uses: instanto-io/instanto-poms/.github/workflows/maven-build.yml@main
    with:
      name: Publish Maven snapshot
      goals: -U deploy
      maven-args: -DskipTests
    secrets: inherit
