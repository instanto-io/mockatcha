name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify core and examples in Chrome
        run: ./mvnw --batch-mode --no-transfer-progress --errors --fail-at-end clean test

  cross-browser:
    name: Clock and DOM (${{ matrix.browser_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser_name: Chrome
            runner: browser-chrome
          - browser_name: Firefox
            runner: browser-firefox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify clock and DOM behavior
        run: >-
          ./mvnw --batch-mode --no-transfer-progress --errors --fail-at-end
          -pl mockatcha-dom -am -Dmockatcha.test.browser=${{ matrix.runner }} test

  publish-snapshot:
    if: github.event_name != 'pull_request'
    needs: [verify, cross-browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Publish Maven snapshot
        run: ./mvnw --settings .github/maven-settings.xml --batch-mode --no-transfer-progress --errors --fail-at-end -DskipTests deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
